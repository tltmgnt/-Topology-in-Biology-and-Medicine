[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-topology"
version = "0.1.0"
description = "Research-only biological network topology and evidence-integrity gap analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.scripts]
researchos = "researchos.__main__:main"
bio-topology = "bio_topology.__main__:main"

[tool.setuptools.packages.find]
include = ["bio_topology*", "researchos*"]

[tool.setuptools.package-data]
researchos = ["*.json"]
