name: Biology topology CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install research package
        run: python -m pip install .
      - name: Topology evidence and signed graph oracle tests
        run: python -m unittest discover -s tests -v
      - name: Installed package research workflows
        run: python tests/check_installed.py
      - name: Create synthetic ambiguity review
        if: matrix.python-version == '3.12'
        run: |
          mkdir -p runs
          python -c "import subprocess; r=subprocess.run(['bio-topology','analyze','examples/ambiguous.json','--requirements','examples/requirements.json','--output','runs/ci-demo']); assert r.returncode == 1, r.returncode"
          bio-topology verify runs/ci-demo
      - name: Upload fictional research review
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-biology-review
          path: runs/ci-demo/
          if-no-files-found: error
          retention-days: 7
